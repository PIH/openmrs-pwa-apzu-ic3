name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-and-publish:
    if: github.repository_owner == 'PIH'
    concurrency:
      group: build-and-deploy-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/build-and-deploy-to-sonatype.yml@main
    secrets: inherit

  # The Malawi distribution includes this app, so rather than deploying it directly, build and publish the
  # distribution, which bundles the newly published app and deploys it (to neno-ci, including /workflow there)
  trigger-downstream-builds:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build of pihmalawi-emr
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          repository: PIH/pihmalawi-emr
          event-type: dependency-trigger
